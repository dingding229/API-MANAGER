# Optional override for private PostgreSQL / Redis CAs. Use only together with
# compose.production.yaml, and keep certificate files outside the repository.
services:
  api-manager:
    environment:
      REDIS_TLS_CA_FILE: /run/certs/redis-ca.pem
    volumes:
      - type: bind
        source: ${PROD_CA_CERTS_DIR:?Set an absolute directory with redis-ca.pem and postgres-ca.pem}
        target: /run/certs
        read_only: true
