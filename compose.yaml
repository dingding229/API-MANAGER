services:
  api-manager:
    image: ${API_MANAGER_IMAGE:-dingding229/api-manager:latest}
    pull_policy: ${API_MANAGER_PULL_POLICY:-always}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3000:3000"
    environment:
      HTTP_ADDR: ":8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN to a random 32+ character secret}
      LOG_LEVEL: "info"
      USE_REDIS: "true"
      USER_JWT_SECRET: ${USER_JWT_SECRET:?Set USER_JWT_SECRET to a separate random 32+ character secret}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set an independent stable encryption key}
      PLUGIN_DIR: "/data/plugins"
      PLUGIN_MAX_BYTES: "20971520"
      PLUGIN_DATABASE_WRITES_ENABLED: "false"
      PLUGIN_LIBRARY_DIR: "/data/plugin-library"
      OBSERVABILITY_DIR: "/data/observability"
      OBSERVABILITY_STACK_ENABLED: ${OBSERVABILITY_STACK_ENABLED:-false}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      OBSERVABILITY_MAX_LOGS: "5000"
      OBSERVABILITY_MAX_TRACES: "2000"
      OBSERVABILITY_FILE_MAX_BYTES: "16777216"
      # Built-in tracing is always available. These options only enable an
      # additional export to an external OpenTelemetry collector.
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: "api-manager"
      POSTGRES_DSN: "postgres://api_manager:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/api_manager?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - plugin_data:/data/plugins
      - plugin_library:/data/plugin-library
      - observability_data:/data/observability
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: api_manager
      POSTGRES_USER: api_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_manager -d api_manager"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  plugin_data:
  plugin_library:
  observability_data:
  redis_data:
