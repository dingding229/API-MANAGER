# Production application only. TLS/reverse proxy, PostgreSQL and Redis are
# provided by the operator. Runtime observability is embedded; optional external
# metric scraping and OTLP export can still be configured. Do not use the
# development .env as a secret store.
name: api-manager-production
services:
  api-manager:
    image: ${API_MANAGER_IMAGE:-docker.io/dingding229/api-manager:latest}
    pull_policy: always
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${PROD_API_MEMORY_LIMIT:-512m}
    cpus: ${PROD_API_CPUS:-1.0}
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_MANAGER_LOCAL_PORT:-8080}:8080"
      - "127.0.0.1:${PROD_GRAFANA_LOCAL_PORT:-3000}:3000"
    environment:
      HTTP_ADDR: ":8080"
      PRODUCTION_MODE: "true"
      USE_REDIS: "true"
      REDIS_ADDR: ${PROD_REDIS_ADDR:?Provide a private Redis endpoint}
      REDIS_USERNAME: ${PROD_REDIS_USERNAME:-}
      REDIS_TLS_ENABLED: "true"
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      USER_JWT_SECRET_FILE: /run/secrets/user_jwt_secret
      CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/credential_encryption_key
      POSTGRES_DSN_FILE: /run/secrets/postgres_dsn
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      PLUGIN_DIR: /data/plugins
      PLUGIN_LIBRARY_DIR: /data/plugin-library
      PLUGIN_DATABASE_WRITES_ENABLED: "false"
      OBSERVABILITY_DIR: /data/observability
      OBSERVABILITY_STACK_ENABLED: ${PROD_OBSERVABILITY_STACK_ENABLED:-false}
      GRAFANA_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      OBSERVABILITY_MAX_LOGS: ${PROD_OBSERVABILITY_MAX_LOGS:-10000}
      OBSERVABILITY_MAX_TRACES: ${PROD_OBSERVABILITY_MAX_TRACES:-5000}
      OBSERVABILITY_FILE_MAX_BYTES: ${PROD_OBSERVABILITY_FILE_MAX_BYTES:-67108864}
      OTEL_ENABLED: ${PROD_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${PROD_OTEL_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${PROD_OTEL_INSECURE:-false}
    secrets:
      - admin_token
      - user_jwt_secret
      - credential_encryption_key
      - postgres_dsn
      - redis_password
      - metrics_token
      - grafana_admin_password
    volumes:
      - plugin_data:/data/plugins
      - plugin_library:/data/plugin-library
      - observability_data:/data/observability
    healthcheck:
      test: ["CMD", "/api-manager", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  admin_token:
    file: ${PROD_SECRETS_DIR:?Set a private absolute directory}/admin_token
  user_jwt_secret:
    file: ${PROD_SECRETS_DIR:?Set a private absolute directory}/user_jwt_secret
  credential_encryption_key:
    file: ${PROD_SECRETS_DIR:?Set a private absolute directory}/credential_encryption_key
  postgres_dsn:
    file: ${PROD_SECRETS_DIR:?Set a private absolute directory}/postgres_dsn
  redis_password:
    file: ${PROD_SECRETS_DIR:?Set a private absolute directory}/redis_password
  metrics_token:
    file: ${PROD_SECRETS_DIR:?Set a private absolute directory}/metrics_token
  grafana_admin_password:
    file: ${PROD_SECRETS_DIR:?Set a private absolute directory}/grafana_admin_password

volumes:
  plugin_data:
    name: ${PROD_PLUGIN_DATA_VOLUME:-api-manager-prod-plugin-data}
  plugin_library:
    name: ${PROD_PLUGIN_LIBRARY_VOLUME:-api-manager-prod-plugin-library}
  observability_data:
    name: ${PROD_OBSERVABILITY_VOLUME:-api-manager-prod-observability}
