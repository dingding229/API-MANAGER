name: CI and Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/dingding229/api-manager

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce release source boundaries
        run: ./scripts/check-release-boundaries.sh
      - name: Restrict manual production publication to main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chart_version=$(awk '$1 == "version:" { print $2; exit }' deploy/helm/api-manager/Chart.yaml)
          app_version=$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2; exit }' deploy/helm/api-manager/Chart.yaml)
          [ "$version" = "$chart_version" ] && [ "$version" = "$app_version" ] || {
            echo "tag v${version} does not match Helm chart version ${chart_version}/${app_version}" >&2
            exit 1
          }
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo 'origin/main was not fetched by checkout' >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo 'release tags must point to a commit on origin/main' >&2
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: public-ui/package-lock.json
      - name: Validate Fumadocs frontend and public data boundary
        working-directory: public-ui
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --ignore-scripts
          npm test
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Test with race detector
        run: go test -race ./...
      - name: Static and vulnerability analysis
        run: |
          go vet ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-generated ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/api-manager ./cmd/server
      - name: Validate Dockerfile
        run: docker build --check .
      - name: Validate production scripts and Compose
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/init-production-secrets.py scripts/backup-production.py scripts/preflight-production.py scripts/verify-production.py scripts/test-production.py
          python3 scripts/test-production.py
          secret_dir="$(mktemp -d)/secrets"
          trap 'rm -rf "$(dirname "$secret_dir")"' EXIT
          python3 scripts/init-production-secrets.py --dir "$secret_dir"
          SECRETS_DIR="$secret_dir" python3 scripts/preflight-production.py
          SECRETS_DIR="$secret_dir" docker compose --env-file /dev/null -f docker-compose.yml config -q
          SECRETS_DIR="$secret_dir" docker compose --env-file /dev/null -f docker-compose.yml config --images \
            | grep -Fx 'docker.io/dingding229/api-manager:latest'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/api-manager \
            --set secrets.ADMIN_PASSWORD=ci-only-admin-password-at-least-thirty-two-characters \
            --set secrets.CREDENTIAL_ENCRYPTION_KEY=ci-only-credential-key-at-least-thirty-two-characters \
            --set secrets.POSTGRES_DSN=postgres://ci:ci@localhost/ci
          helm template api-manager deploy/helm/api-manager \
            --set secrets.ADMIN_PASSWORD=ci-only-admin-password-at-least-thirty-two-characters \
            --set secrets.CREDENTIAL_ENCRYPTION_KEY=ci-only-credential-key-at-least-thirty-two-characters \
            --set secrets.POSTGRES_DSN=postgres://ci:ci@localhost/ci >/dev/null
          helm lint deploy/helm/api-manager \
            --set productionMode=true --set serviceMonitor.enabled=true \
            --set existingSecret=ci-placeholder \
            --set image.tag=latest --set image.pullPolicy=Always \
            --set env.REDIS_TLS_ENABLED=true
          helm template api-manager deploy/helm/api-manager \
            --set productionMode=true --set serviceMonitor.enabled=true \
            --set existingSecret=ci-placeholder \
            --set image.tag=latest --set image.pullPolicy=Always \
            --set env.REDIS_TLS_ENABLED=true \
            > /tmp/api-manager-production.yaml
          test "$(grep -Ec 'image: "docker\.io/dingding229/api-manager:latest"' /tmp/api-manager-production.yaml)" -eq 2
      - name: Scan rendered Kubernetes manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/api-manager-production.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan repository for vulnerabilities, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  scan:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Large Go dependency graphs need disk headroom on GitHub-hosted runners.
      # Scan the loaded image after clearing BuildKit cache to avoid a second disk exhaustion.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: api-manager:scan
      - name: Free runner toolchains and Docker build cache before image scan
        run: |
          # The loaded image is large; Trivy also needs temporary space to export layers.
          # The upstream binaries are built inside Docker, so these host toolchains are unused.
          sudo rm -rf /opt/hostedtoolcache /usr/local/swift /usr/local/share/powershell
          docker builder prune --all --force
          df -h /
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api-manager:scan
          trivy-config: security/trivy.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify bundled executables and release boundary
        run: |
          set -euo pipefail
          container_id=$(docker create api-manager:scan)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" | tar -tf - > /tmp/api-manager-files.txt
          for component in loki tempo prometheus alertmanager alloy; do
            grep -Fx "usr/local/bin/$component" /tmp/api-manager-files.txt >/dev/null || {
              echo "Bundled observability executable missing: $component" >&2
              exit 1
            }
          done
          if grep -E '(^|/)data/plugins/.+|\.wasm$' /tmp/api-manager-files.txt; then
            echo 'The release image contains a bundled plugin package.' >&2
            exit 1
          fi


      - name: Test Compose username-password login and API authentication modes
        shell: bash
        run: |
          set -euo pipefail
          export SECRETS_DIR="$(mktemp -d)/secrets"
          export API_MANAGER_IMAGE=docker.io/dingding229/api-manager:ci-scan
          export POSTGRES_DATA_VOLUME="api-manager-ci-${GITHUB_RUN_ID}-postgres"
          export REDIS_DATA_VOLUME="api-manager-ci-${GITHUB_RUN_ID}-redis"
          export PLUGIN_DATA_VOLUME="api-manager-ci-${GITHUB_RUN_ID}-plugins"
          export PLUGIN_LIBRARY_VOLUME="api-manager-ci-${GITHUB_RUN_ID}-library"
          export OBSERVABILITY_DATA_VOLUME="api-manager-ci-${GITHUB_RUN_ID}-observability"
          cleanup() {
            docker compose --env-file /dev/null -f docker-compose.yml down -v >/dev/null 2>&1 || true
            rm -rf "$(dirname "$SECRETS_DIR")"
          }
          trap cleanup EXIT
          python3 scripts/init-production-secrets.py --dir "$SECRETS_DIR"
          docker tag api-manager:scan "$API_MANAGER_IMAGE"
          docker compose --env-file /dev/null -f docker-compose.yml pull postgres redis
          docker compose --env-file /dev/null -f docker-compose.yml up -d --pull never --wait --wait-timeout 180
          python3 scripts/verify-production.py --url http://127.0.0.1:8080 --secret-dir "$SECRETS_DIR"
          python3 - <<'PYTEST'
          import json, os, pathlib
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          root=pathlib.Path(os.environ['SECRETS_DIR'])
          password=(root/'admin_password').read_text().strip()
          def call(method,path,key=None,data=None,session=None):
              headers={'Content-Type':'application/json'}
              if key: headers['X-API-Key']=key
              if session: headers['Authorization']='Bearer '+session
              payload=None if data is None else json.dumps(data).encode()
              try:
                  with urlopen(Request('http://127.0.0.1:8080'+path,data=payload,headers=headers,method=method),timeout=5) as response:
                      body=response.read()
                      return response.status,(json.loads(body) if body else {})
              except HTTPError as error:
                  error.close(); return error.code,{}
          status,login=call('POST','/auth/v1/login',data={'username':'admin','password':password})
          assert status==200
          session=login['token']
          assert call('GET','/auth/v1/me',session=session)[0]==200
          # The front page and admin UI share the API listener.
          for path in ('/', '/admin/', '/admin/app.js'):
              with urlopen('http://127.0.0.1:8080'+path,timeout=10) as response:
                  assert response.status==200
          assert call('GET','/catalog.json')[0]==200
          assert call('GET','/admin/v1/apis',key='ak_invalid_business_key')[0]==401
          for mode in ('jwt','hmac'):
              assert call('POST','/admin/v1/apis',session=session,data={'name':'rejected','method':'GET','path':'/api/rejected','auth_mode':mode})[0]==400
          status,route=call('POST','/admin/v1/apis',session=session,data={'name':'protected','method':'GET','path':'/api/protected','response_body':'{"ok":true}'})
          assert status==201 and route['auth_mode']=='api_key'
          assert call('POST','/admin/v1/apis/'+route['id']+'/publish',session=session)[0]==200
          assert call('GET','/api/protected')[0]==401
          assert call('GET','/api/protected',session=session)[0]==401
          status,credential=call('POST','/admin/v1/credentials',session=session,data={'name':'integration'})
          assert status==201
          key=credential['api_key']
          assert call('GET','/api/protected',key=key)[0]==200
          assert call('GET','/admin/v1/apis',key=key)[0]==401
          status,public=call('POST','/admin/v1/apis',session=session,data={'name':'public','method':'GET','path':'/api/public','auth_mode':'none','response_body':'{"public":true}'})
          assert status==201 and public['auth_mode']=='none'
          assert call('POST','/admin/v1/apis/'+public['id']+'/publish',session=session)[0]==200
          assert call('GET','/api/public')[0]==200
          status,audits=call('GET','/admin/v1/audit-logs',session=session)
          assert status==200 and audits['items']
          assert call('POST','/admin/v1/credentials/'+credential['credential']['id']+'/revoke',session=session)[0]==200
          assert call('GET','/api/protected',key=key)[0]==401
          for item in (route,public):
              assert call('DELETE','/admin/v1/apis/'+item['id'],session=session)[0]==204
          assert call('POST','/auth/v1/logout',session=session)[0]==204
          assert call('GET','/auth/v1/me',session=session)[0]==401
          print('PASS: password login, session revocation, API KEY/public modes and scopes validated')
          PYTEST

  publish-amd64:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: scan
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push private amd64 image from verified source
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:staged-${{ github.sha }}-amd64
          provenance: mode=max
          sbom: true

      - name: Scan final amd64 image before promoting latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          trivy-config: security/trivy.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish-arm64:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: scan
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push private arm64 image from verified source
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}:staged-${{ github.sha }}-arm64
          provenance: mode=max
          sbom: true

      - name: Scan final arm64 image before promoting latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          trivy-config: security/trivy.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish-manifest:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [publish-amd64, publish-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Publish multi-platform manifest
        shell: bash
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
          AMD64_DIGEST: ${{ needs.publish-amd64.outputs.image-digest }}
          ARM64_DIGEST: ${{ needs.publish-arm64.outputs.image-digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$PUBLISH_TAGS"
          [ "${#args[@]}" -gt 0 ]
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE_NAME}@${AMD64_DIGEST}" \
            "${IMAGE_NAME}@${ARM64_DIGEST}"
          docker buildx imagetools inspect "${args[1]}"
          echo '### Private multi-platform Docker image published' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${PUBLISH_TAGS}" >> "$GITHUB_STEP_SUMMARY"
