name: CI and Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: dingding229/api-manager

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce release source boundaries
        run: ./scripts/check-release-boundaries.sh
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chart_version=$(awk '$1 == "version:" { print $2; exit }' deploy/helm/api-manager/Chart.yaml)
          app_version=$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2; exit }' deploy/helm/api-manager/Chart.yaml)
          [ "$version" = "$chart_version" ] && [ "$version" = "$app_version" ] || {
            echo "tag v${version} does not match Helm chart version ${chart_version}/${app_version}" >&2
            exit 1
          }
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo 'origin/main was not fetched by checkout' >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo 'release tags must point to a commit on origin/main' >&2
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true
      - name: Test with race detector
        run: go test -race ./...
      - name: Static and vulnerability analysis
        run: |
          go vet ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-generated ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/api-manager ./cmd/server
      - name: Validate Dockerfile
        run: docker build --check .
      - name: Validate production scripts and Compose
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/init-production-secrets.py scripts/backup-production.py scripts/preflight-production.py scripts/verify-production.py
          secret_dir=$(mktemp -d)
          trap 'rm -rf "$secret_dir"' EXIT
          chmod 0700 "$secret_dir"
          printf '%s\n' ci-admin-token-at-least-thirty-two-characters > "$secret_dir/admin_token"
          printf '%s\n' ci-user-jwt-secret-at-least-thirty-two-characters > "$secret_dir/user_jwt_secret"
          printf '%s\n' ci-credential-key-at-least-thirty-two-characters > "$secret_dir/credential_encryption_key"
          printf '%s\n' ci-metrics-token-at-least-thirty-two-characters > "$secret_dir/metrics_token"
          printf '%s\n' ci-grafana-password-at-least-thirty-two-characters > "$secret_dir/grafana_admin_password"
          printf '%s\n' 'postgres://ci:password@postgres.example:5432/api?sslmode=verify-full' > "$secret_dir/postgres_dsn"
          printf '%s\n' ci-redis-password-at-least-thirty-two-characters > "$secret_dir/redis_password"
          chmod 0444 "$secret_dir"/*
          API_MANAGER_IMAGE=example/api-manager@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          PROD_SECRETS_DIR="$secret_dir" PROD_REDIS_ADDR=redis.example:6380 \
          python3 scripts/preflight-production.py
          API_MANAGER_IMAGE=example/api-manager@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          PROD_SECRETS_DIR="$secret_dir" PROD_REDIS_ADDR=redis.example:6380 \
          docker compose --env-file /dev/null -f compose.production.yaml config -q
      - name: Validate bundled Grafana dashboard
        run: python3 -m json.tool internal/stack/config/grafana/dashboards/api-manager.json >/dev/null
      - name: Validate development Compose
        run: docker compose config >/dev/null
        env:
          ADMIN_TOKEN: ci-only-admin-token-at-least-thirty-two-characters
          USER_JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
          CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-key-at-least-thirty-two-characters
          POSTGRES_PASSWORD: ci-only-database-password
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/api-manager \
            --set secrets.ADMIN_TOKEN=ci-only-admin-token-at-least-thirty-two-characters \
            --set secrets.USER_JWT_SECRET=ci-only-jwt-secret-at-least-thirty-two-characters \
            --set secrets.CREDENTIAL_ENCRYPTION_KEY=ci-only-credential-key-at-least-thirty-two-characters \
            --set secrets.POSTGRES_DSN=postgres://ci:ci@localhost/ci
          helm template api-manager deploy/helm/api-manager \
            --set secrets.ADMIN_TOKEN=ci-only-admin-token-at-least-thirty-two-characters \
            --set secrets.USER_JWT_SECRET=ci-only-jwt-secret-at-least-thirty-two-characters \
            --set secrets.CREDENTIAL_ENCRYPTION_KEY=ci-only-credential-key-at-least-thirty-two-characters \
            --set secrets.POSTGRES_DSN=postgres://ci:ci@localhost/ci >/dev/null
          helm lint deploy/helm/api-manager \
            --set productionMode=true --set serviceMonitor.enabled=true \
            --set existingSecret=ci-placeholder \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set env.REDIS_TLS_ENABLED=true
          helm template api-manager deploy/helm/api-manager \
            --set productionMode=true --set serviceMonitor.enabled=true \
            --set existingSecret=ci-placeholder \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set env.REDIS_TLS_ENABLED=true \
            --set 'authSecretFiles[0]=API_AUTH_JWT_HS256_SECRET' > /tmp/api-manager-production.yaml
      - name: Scan rendered Kubernetes manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/api-manager-production.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan repository for vulnerabilities, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  scan:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Large Go dependency graphs need disk headroom on GitHub-hosted runners.
      # Scan the loaded image after clearing BuildKit cache to avoid a second disk exhaustion.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: api-manager:scan
      - name: Free runner toolchains and Docker build cache before image scan
        run: |
          # The loaded image is large; Trivy also needs temporary space to export layers.
          # The upstream binaries are built inside Docker, so these host toolchains are unused.
          sudo rm -rf /opt/hostedtoolcache /usr/local/swift /usr/local/share/powershell
          docker builder prune --all --force
          df -h /
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api-manager:scan
          trivy-config: security/trivy.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify bundled executables and release boundary
        run: |
          set -euo pipefail
          container_id=$(docker create api-manager:scan)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" | tar -tf - > /tmp/api-manager-files.txt
          for component in loki tempo prometheus alertmanager alloy grafana; do
            grep -Fx "usr/local/bin/$component" /tmp/api-manager-files.txt >/dev/null || {
              echo "Bundled observability executable missing: $component" >&2
              exit 1
            }
          done
          if grep -E '(^|/)data/plugins/.+|\.wasm$' /tmp/api-manager-files.txt; then
            echo 'The release image contains a bundled plugin package.' >&2
            exit 1
          fi

  publish-amd64:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push private amd64 image from verified source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:staged-${{ github.sha }}-amd64
          provenance: mode=max
          sbom: true

  publish-arm64:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push private arm64 image from verified source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}:staged-${{ github.sha }}-arm64
          provenance: mode=max
          sbom: true

  publish-manifest:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [publish-amd64, publish-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Publish multi-platform manifest
        shell: bash
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$PUBLISH_TAGS"
          [ "${#args[@]}" -gt 0 ]
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE_NAME}:staged-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:staged-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${args[1]}"
          echo '### Private multi-platform Docker image published' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${PUBLISH_TAGS}" >> "$GITHUB_STEP_SUMMARY"
