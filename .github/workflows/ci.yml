name: CI and Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: dingding229/api-manager

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce release source boundaries
        run: ./scripts/check-release-boundaries.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Static analysis
        run: go vet ./...
      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/api-manager ./cmd/server
      - name: Validate Dockerfile
        run: docker build --check .
      - name: Validate production scripts and Compose
        run: |
          python3 -m py_compile scripts/init-production-secrets.py scripts/backup-production.py scripts/preflight-production.py scripts/verify-production.py
          API_MANAGER_IMAGE=example/api-manager@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          PROD_SECRETS_DIR=/tmp/ci-secrets PROD_REDIS_ADDR=redis.example:6380 \
          docker compose --env-file /dev/null -f compose.production.yaml config -q
          PROD_CA_CERTS_DIR=/tmp/ci-certs \
          API_MANAGER_IMAGE=example/api-manager@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          PROD_SECRETS_DIR=/tmp/ci-secrets PROD_REDIS_ADDR=redis.example:6380 \
          docker compose --env-file /dev/null -f compose.production.yaml -f compose.production.private-ca.yaml config -q
      - name: Validate bundled Grafana dashboard
        run: python3 -m json.tool internal/stack/config/grafana/dashboards/api-manager.json >/dev/null
      - name: Validate development Compose
        run: docker compose config >/dev/null
        env:
          ADMIN_TOKEN: ci-only-admin-token-at-least-thirty-two-characters
          USER_JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
          CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-key-at-least-thirty-two-characters
          POSTGRES_PASSWORD: ci-only-database-password
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/api-manager \
            --set secrets.ADMIN_TOKEN=ci-only-admin-token-at-least-thirty-two-characters \
            --set secrets.USER_JWT_SECRET=ci-only-jwt-secret-at-least-thirty-two-characters \
            --set secrets.CREDENTIAL_ENCRYPTION_KEY=ci-only-credential-key-at-least-thirty-two-characters \
            --set secrets.POSTGRES_DSN=postgres://ci:ci@localhost/ci
          helm template api-manager deploy/helm/api-manager \
            --set secrets.ADMIN_TOKEN=ci-only-admin-token-at-least-thirty-two-characters \
            --set secrets.USER_JWT_SECRET=ci-only-jwt-secret-at-least-thirty-two-characters \
            --set secrets.CREDENTIAL_ENCRYPTION_KEY=ci-only-credential-key-at-least-thirty-two-characters \
            --set secrets.POSTGRES_DSN=postgres://ci:ci@localhost/ci >/dev/null
          helm lint deploy/helm/api-manager \
            --set productionMode=true --set serviceMonitor.enabled=true \
            --set existingSecret=ci-placeholder \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set env.REDIS_TLS_ENABLED=true
          helm template api-manager deploy/helm/api-manager \
            --set productionMode=true --set serviceMonitor.enabled=true \
            --set existingSecret=ci-placeholder \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set env.REDIS_TLS_ENABLED=true >/dev/null
      - name: Scan repository for vulnerabilities, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: api-manager:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api-manager:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify image has no bundled plugin packages
        run: |
          container_id=$(docker create api-manager:scan)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" > /tmp/api-manager-image.tar
          for component in loki tempo prometheus alertmanager alloy grafana; do
            tar -tf /tmp/api-manager-image.tar | grep -Fx "usr/local/bin/$component" >/dev/null || {
              echo "Bundled observability executable missing: $component" >&2
              exit 1
            }
          done
          if tar -tf /tmp/api-manager-image.tar | grep -E '(^|/)data/plugins/.+|\.wasm$'; then
            echo 'The release image contains a bundled plugin package.' >&2
            exit 1
          fi
      - name: Log in to private Docker Hub repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push private multi-platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Publish summary
        run: |
          echo '### Private Docker image published' >> "$GITHUB_STEP_SUMMARY"
          echo '- Repository: `${{ env.IMAGE_NAME }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Digest: `${{ steps.push.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
