{{- if ne .Values.image.repository "docker.io/dingding229/api-manager" }}{{ fail "image.repository must be docker.io/dingding229/api-manager" }}{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" (.Values.image.tag | toString)) }}{{ fail "image.tag must be a Docker Hub tag" }}{{- end }}
{{- if and .Values.productionMode (ne .Values.image.pullPolicy "Always") }}{{ fail "productionMode requires image.pullPolicy=Always" }}{{- end }}
{{- $stackEnabled := eq (lower (toString (index .Values.env "OBSERVABILITY_STACK_ENABLED"))) "true" -}}
{{- if gt (int .Values.replicaCount) 1 }}{{ fail "replicaCount > 1 requires a distributed plugin reload mechanism; use one replica" }}{{- end }}
{{- if and .Values.productionMode (not .Values.existingSecret) }}{{ fail "productionMode requires existingSecret; do not store production secrets in Helm values" }}{{- end }}
{{- if and .Values.productionMode (not .Values.persistence.enabled) }}{{ fail "productionMode requires persistence.enabled=true for runtime data" }}{{- end }}
{{- if and .Values.productionMode (ne (toString (index .Values.env "REDIS_TLS_ENABLED")) "true") }}{{ fail "productionMode requires env.REDIS_TLS_ENABLED=true" }}{{- end }}
{{- if and .Values.ingress.enabled (not .Values.productionMode) }}{{ fail "ingress.enabled requires productionMode=true" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-manager.fullname" . }}
  labels:
    {{- include "api-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # One process owns an RWO data volume and an in-memory plugin registry. Recreate
  # avoids a rolling-update multi-attach deadlock and split ownership of state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "api-manager.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "api-manager.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "api-manager.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: initialize-data-directories
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args: ["mkdir -p /data/plugins /data/plugin-library /data/observability && chmod 0700 /data/plugins /data/plugin-library /data/observability"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: api-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: PRODUCTION_MODE
              value: {{ .Values.productionMode | quote }}
            - name: ADMIN_PASSWORD_FILE
              value: /run/secrets/ADMIN_PASSWORD
            - name: POSTGRES_DSN_FILE
              value: /run/secrets/POSTGRES_DSN
            - name: CREDENTIAL_ENCRYPTION_KEY_FILE
              value: /run/secrets/CREDENTIAL_ENCRYPTION_KEY
            {{- if $stackEnabled }}
            - name: GRAFANA_ADMIN_PASSWORD_FILE
              value: /run/secrets/GRAFANA_ADMIN_PASSWORD
            {{- end }}
            {{- if .Values.productionMode }}
            - name: REDIS_PASSWORD_FILE
              value: /run/secrets/REDIS_PASSWORD
            - name: METRICS_TOKEN_FILE
              value: /run/secrets/METRICS_TOKEN
            {{- else }}
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ default (include "api-manager.fullname" .) .Values.existingSecret }}, key: REDIS_PASSWORD } }
            {{- end }}
            - name: PLUGIN_LIBRARY_DIR
              value: /data/plugin-library
            - name: PLUGIN_DIR
              value: /data/plugins
            - name: OBSERVABILITY_DIR
              value: /data/observability
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /data/plugin-library
              subPath: plugin-library
            - name: data
              mountPath: /data/plugins
              subPath: plugins
            - name: data
              mountPath: /data/observability
              subPath: observability
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: runtime-secrets
          secret:
            secretName: {{ default (include "api-manager.fullname" .) .Values.existingSecret | quote }}
            defaultMode: 0440
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "api-manager.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
