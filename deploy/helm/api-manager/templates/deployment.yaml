{{- if gt (int .Values.replicaCount) 1 }}{{ fail "replicaCount > 1 requires a distributed plugin reload mechanism; use one replica" }}{{- end }}
{{- if and .Values.productionMode (not (regexMatch "^sha256:[0-9a-f]{64}$" (.Values.image.digest | toString))) }}{{ fail "productionMode requires a full lowercase sha256 image.digest" }}{{- end }}
{{- if and .Values.productionMode (not .Values.existingSecret) }}{{ fail "productionMode requires existingSecret; do not store production secrets in Helm values" }}{{- end }}
{{- if and .Values.productionMode (not .Values.persistence.enabled) }}{{ fail "productionMode requires persistence.enabled=true for plugin assets" }}{{- end }}
{{- if and .Values.productionMode (ne (toString (index .Values.env "REDIS_TLS_ENABLED")) "true") }}{{ fail "productionMode requires env.REDIS_TLS_ENABLED=true" }}{{- end }}
{{- if and .Values.ingress.enabled (not .Values.productionMode) }}{{ fail "ingress.enabled requires productionMode=true" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-manager.fullname" . }}
  labels:
    {{- include "api-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "api-manager.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "api-manager.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "api-manager.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api-manager
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: PRODUCTION_MODE
              value: {{ .Values.productionMode | quote }}
            {{- if .Values.productionMode }}
            - name: METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: {{ default (include "api-manager.fullname" .) .Values.existingSecret }}, key: METRICS_TOKEN } }
            {{- end }}
            - name: ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ default (include "api-manager.fullname" .) .Values.existingSecret }}, key: ADMIN_TOKEN } }
            - name: USER_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ default (include "api-manager.fullname" .) .Values.existingSecret }}, key: USER_JWT_SECRET } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ default (include "api-manager.fullname" .) .Values.existingSecret }}, key: REDIS_PASSWORD } }
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: {{ default (include "api-manager.fullname" .) .Values.existingSecret }}, key: POSTGRES_DSN } }
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ default (include "api-manager.fullname" .) .Values.existingSecret }}, key: CREDENTIAL_ENCRYPTION_KEY } }
            - name: PLUGIN_LIBRARY_DIR
              value: /data/plugin-library
            - name: PLUGIN_DIR
              value: /data/plugins
          volumeMounts:
            {{- if .Values.trustedCA.secretName }}
            - name: trusted-ca
              mountPath: /etc/api-manager/ca
              readOnly: true
            {{- end }}
            - name: plugin-library
              mountPath: /data/plugin-library
              {{- if .Values.persistence.enabled }}
              subPath: plugin-library
              {{- end }}
            - name: plugins
              mountPath: /data/plugins
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.trustedCA.secretName }}
        - name: trusted-ca
          secret:
            secretName: {{ .Values.trustedCA.secretName | quote }}
        {{- end }}
        - name: plugin-library
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "api-manager.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: plugins
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "api-manager.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
