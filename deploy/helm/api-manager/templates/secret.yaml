{{- $stackEnabled := eq (lower (toString (index .Values.env "OBSERVABILITY_STACK_ENABLED"))) "true" -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-manager.fullname" . }}
  labels:
    {{- include "api-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  METRICS_TOKEN: {{ if .Values.productionMode }}{{ required "secrets.METRICS_TOKEN is required in production" .Values.secrets.METRICS_TOKEN | quote }}{{ else }}{{ .Values.secrets.METRICS_TOKEN | quote }}{{ end }}
  ADMIN_TOKEN: {{ required "secrets.ADMIN_TOKEN is required" .Values.secrets.ADMIN_TOKEN | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.REDIS_PASSWORD | quote }}
  POSTGRES_DSN: {{ required "secrets.POSTGRES_DSN is required" .Values.secrets.POSTGRES_DSN | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ required "secrets.CREDENTIAL_ENCRYPTION_KEY is required" .Values.secrets.CREDENTIAL_ENCRYPTION_KEY | quote }}
  {{- if $stackEnabled }}
  GRAFANA_ADMIN_PASSWORD: {{ required "secrets.GRAFANA_ADMIN_PASSWORD is required when the observability stack is enabled" .Values.secrets.GRAFANA_ADMIN_PASSWORD | quote }}
  {{- end }}
{{- end }}
