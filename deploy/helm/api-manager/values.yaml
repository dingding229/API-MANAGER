productionMode: false # set true in a production values file; enables runtime fail-closed guards
replicaCount: 1 # in-process plugin registry; scale only after distributed reload is implemented

image:
  repository: docker.io/dingding229/api-manager
  tag: "latest"
  pullPolicy: Always

# Required when pulling the private Docker Hub image.
imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: api-manager.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 512Mi

env:
  HTTP_ADDR: ":8080"
  LOG_LEVEL: info
  USE_REDIS: "true"
  REDIS_ADDR: redis:6379
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: api-manager
  OBSERVABILITY_DIR: /data/observability
  OBSERVABILITY_STACK_ENABLED: "false"
  OBSERVABILITY_MAX_LOGS: "10000"
  OBSERVABILITY_MAX_TRACES: "5000"
  OBSERVABILITY_FILE_MAX_BYTES: "67108864"

existingSecret: "" # use a pre-created Secret instead of chart-managed values

# Route-level JWT/HMAC secrets stay in the API_AUTH_ namespace. In production,
# add these keys to existingSecret; the chart exposes only *_FILE paths.
authSecretFiles: []
# - API_AUTH_JWT_HS256_SECRET
# - API_AUTH_PARTNER_HMAC

secrets:
  ADMIN_TOKEN: ""
  USER_JWT_SECRET: ""
  REDIS_PASSWORD: ""
  CREDENTIAL_ENCRYPTION_KEY: ""
  POSTGRES_DSN: ""
  METRICS_TOKEN: ""
  GRAFANA_ADMIN_PASSWORD: ""

persistence:
  enabled: true
  accessModes: [ReadWriteOnce]
  size: 10Gi
  storageClass: ""

serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

networkPolicy:
  # In production ingress defaults to deny-all. Add explicit proxy and Prometheus
  # namespace/pod selectors with TCP port 8080; never select all namespaces.
  allowedIngress: []
  # Extra explicit destinations required for upstream calls outside the namespace.
  extraEgress: []
