<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Manager Console</title>
  <link rel="stylesheet" href="__ADMIN_PATH__/app.css">
  <link rel="stylesheet" href="__ADMIN_PATH__/controls.css">
</head>
<body data-admin-path="__ADMIN_PATH__">
  <main id="app">
    <section id="auth-loading" class="auth-loading" role="status" aria-live="polite"><div><span class="auth-spinner" aria-hidden="true"></span><h1>正在确认登录状态</h1><p>请稍候…</p><button type="button" id="retry-auth" class="secondary hidden">重新连接</button></div></section>
    <section id="login-view" class="auth-shell hidden">
      <div class="auth-card">
        <p class="eyebrow">API MANAGER</p>
        <h1 id="login-site-title">管理控制台</h1>
        <p class="muted">登录后管理接口、用户与网站设置。</p>
        <form id="login-form" class="form-stack">
          <label class="field" for="username"><span class="field-label">用户名</span><input id="username" name="username" type="text" required autocomplete="username" placeholder="用户名"></label>
          <label class="field" for="password"><span class="field-label">密码</span><input id="password" name="password" type="password" aria-label="密码" aria-describedby="login-password-hint" required autocomplete="current-password" maxlength="72" placeholder="密码"><span id="login-password-hint" class="field-hint">新用户请使用注册链接创建管理员账号。</span></label>
          <button type="submit">登录</button>
        </form>
        <a href="/account?return=admin" class="auth-recovery-link">邮箱登录、注册与双重验证</a>
        <button type="button" id="forgot-password" class="auth-recovery-link">忘记密码？</button>
        <p id="auth-message" class="message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="console-view" class="console hidden">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>API Manager</strong></div>
        <nav id="nav" aria-label="管理后台导航">
          <button data-page="overview" class="active">总览</button>
          <button data-page="apis" data-permission="api.read">接口管理</button>
          <button data-page="credentials" data-permission="credential.read">调用凭证</button>
          <button data-page="users" data-permission="user.read">用户管理</button>
          <button data-page="roles" data-permission="user.read">角色与权限</button>
          <button data-page="plugins" data-permission="plugin.read">插件</button>
          <button data-page="observability" data-permission="observability.read">运行观测</button>
          <button data-page="audit" data-permission="audit.read">审计日志</button>
          <button data-page="accounts" data-super-admin="true" class="hidden">用户余额</button>
          <button data-page="plans" data-super-admin="true" class="hidden">套餐管理</button>
          <button data-page="calllogs" data-super-admin="true" class="hidden">调用日志</button>
          <button data-page="authentication" data-super-admin="true" class="hidden">注册与登录</button>
          <button data-page="settings" data-super-admin="true" class="hidden">网站设置</button>
        </nav>
        <div class="version-status" aria-label="程序版本"><span id="current-version">版本读取中…</span><span id="update-status" class="small" role="status" aria-live="polite"></span><button type="button" id="check-update" class="link">检查更新</button></div>
        <div class="account"><span id="current-user"></span><div class="account-actions"><button id="account-settings" class="link">账号设置</button><button id="logout" class="link">退出登录</button></div></div>
      </aside>
      <section class="content" aria-labelledby="page-title">
        <header><div><p class="eyebrow">管理中心</p><h1 id="page-title">总览</h1></div><button id="refresh" class="secondary">刷新</button></header>
        <p id="message" class="message" role="status" aria-live="polite" aria-atomic="true"></p>
        <div id="page"></div>
      </section>
    </section>
  </main>
  <template id="empty"><div class="empty">暂无数据</div></template>
  <script src="__ADMIN_PATH__/app.js"></script>
 <script src="__ADMIN_PATH__/account.js"></script>
 <script src="__ADMIN_PATH__/consolidation.js"></script>
</body>
</html>
