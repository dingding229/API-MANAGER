<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Manager Console</title>
  <link rel="stylesheet" href="__ADMIN_PATH__/app.css">
</head>
<body data-admin-path="__ADMIN_PATH__">
  <main id="app">
    <section id="login-view" class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">API MANAGER</p>
        <h1>管理控制台</h1>
        <p class="muted">使用用户名和密码登录，业务 API 可选择 KEY 或无需验证。</p>
        <form id="login-form" class="form-stack">
          <label class="field" for="username"><span class="field-label">用户名</span><input id="username" name="username" type="text" required autocomplete="username" placeholder="用户名或原有邮箱"></label>
          <label class="field" for="password"><span class="field-label">密码</span><input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="72" placeholder="密码"><span class="field-hint">首次部署默认用户名 admin；初始密码保存在 secrets/admin_password。</span></label>
          <button type="submit">登录</button>
        </form>
        <p id="auth-message" class="message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="console-view" class="console hidden">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>API Manager</strong></div>
        <nav id="nav">
          <button data-page="overview" class="active">总览</button>
          <button data-page="apis" data-permission="api.read">接口管理</button>
          <button data-page="credentials" data-permission="credential.read">调用凭证</button>
          <button data-page="users" data-permission="user.read">用户管理</button>
          <button data-page="roles" data-permission="user.read">角色与权限</button>
          <button data-page="plugins" data-permission="plugin.read">插件</button>
          <button data-page="observability" data-permission="observability.read">运行观测</button>
          <button data-page="audit" data-permission="audit.read">审计日志</button>
        </nav>
        <div class="account"><span id="current-user"></span><button id="logout" class="link">退出登录</button></div>
      </aside>
      <section class="content">
        <header><div><p class="eyebrow">CONTROL PLANE</p><h1 id="page-title">总览</h1></div><button id="refresh" class="secondary">刷新</button></header>
        <p id="message" class="message"></p>
        <div id="page"></div>
      </section>
    </section>
  </main>
  <template id="empty"><div class="empty">暂无数据</div></template>
  <script src="__ADMIN_PATH__/app.js"></script>
</body>
</html>
