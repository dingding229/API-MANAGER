<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Manager Console</title>
  <link rel="stylesheet" href="/console/app.css">
</head>
<body>
  <main id="app">
    <section id="login-view" class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">API MANAGER</p>
        <h1>管理控制台</h1>
        <p class="muted">使用管理员 KEY 登录，无需账号密码或首次初始化。</p>
        <form id="login-form" class="form-stack">
          <label class="field" for="admin-key"><span class="field-label">管理员 KEY</span><input id="admin-key" type="password" required autocomplete="current-password" minlength="32" placeholder="管理员 KEY" aria-describedby="key-hint"><span id="key-hint" class="field-hint">使用 secrets/admin_token 中的 KEY。KEY 仅保存在当前浏览器会话中。</span></label>
          <button type="submit">登录</button>
        </form>
        <p id="auth-message" class="message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="console-view" class="console hidden">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>API Manager</strong></div>
        <nav id="nav">
          <button data-page="overview" class="active">总览</button>
          <button data-page="apis" data-permission="api.read">接口管理</button>
          <button data-page="credentials" data-permission="credential.read">调用凭证</button>
          <button data-page="plugins" data-permission="plugin.read">插件</button>
          <button data-page="observability" data-permission="observability.read">运行观测</button>
          <button data-page="audit" data-permission="audit.read">审计日志</button>
        </nav>
        <div class="account"><span id="current-user"></span><button id="logout" class="link">退出登录</button></div>
      </aside>
      <section class="content">
        <header><div><p class="eyebrow">CONTROL PLANE</p><h1 id="page-title">总览</h1></div><button id="refresh" class="secondary">刷新</button></header>
        <p id="message" class="message"></p>
        <div id="page"></div>
      </section>
    </section>
  </main>
  <template id="empty"><div class="empty">暂无数据</div></template>
  <script src="/console/app.js"></script>
</body>
</html>
