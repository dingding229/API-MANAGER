<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Manager Console</title>
  <link rel="stylesheet" href="__ADMIN_PATH__/app.css">
  <link rel="stylesheet" href="__ADMIN_PATH__/controls.css">
</head>
<body data-admin-path="__ADMIN_PATH__">
  <main id="app">
    <section id="auth-loading" class="auth-loading" role="status" aria-live="polite"><div><span class="auth-spinner" aria-hidden="true"></span><h1 class="sr-only">正在确认登录状态</h1><p class="sr-only">请稍候…</p><button type="button" id="retry-auth" class="secondary hidden">重新连接</button></div></section>
    <section id="setup-view" class="auth-shell hidden">
      <div class="auth-card">
        <p class="eyebrow">API MANAGER</p>
        <h1>注册首个管理员</h1>
        <p class="muted">仅首次部署可用。已有账号请使用网站统一登录页面。</p>
        <p id="auth-message" class="message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="console-view" class="console hidden">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>API Manager</strong></div>
        <nav id="nav" aria-label="管理后台导航">
          <button data-page="overview" data-permission="api.read" class="active">总览</button>
          <button data-page="apis" data-permission="api.read">接口管理</button>
          <button data-page="credentials" data-permission="credential.read">调用凭证</button>
          <button data-page="users" data-permission="user.read">用户管理</button>
          <button data-page="roles" data-permission="user.read">角色与权限</button>
          <button data-page="plugins" data-permission="plugin.read">插件</button>
          <button data-page="observability" data-permission="observability.read">运行观测</button>
          <button data-page="audit" data-permission="audit.read">审计日志</button>
          <button data-page="accounts" data-permission="billing.read" class="hidden">用户余额</button>
          <button data-page="cards" data-permission="card.manage" class="hidden">卡密管理</button>
          <button data-page="plans" data-permission="billing.read" class="hidden">套餐管理</button>
          <button data-page="calllogs" data-permission="audit.read" class="hidden">调用日志</button>
          <button data-page="authentication" data-super-admin="true" class="hidden">注册与登录</button>
          <button data-page="settings" data-super-admin="true" class="hidden">网站设置</button>
        </nav>
        <div class="version-status" aria-label="程序版本"><span id="current-version" aria-label="程序版本"><span class="ui-placeholder-line" aria-hidden="true"></span></span><span id="update-status" class="small" role="status" aria-live="polite"></span><button type="button" id="check-update" data-permission="api.read" class="link">检查更新</button></div>
        <div class="account"><span id="current-user"></span><div class="account-actions"><button id="account-settings" class="link">账号设置</button><button id="logout" class="link">退出登录</button></div></div>
      </aside>
      <section class="content" aria-labelledby="page-title">
        <header><div><p class="eyebrow">管理中心</p><h1 id="page-title">总览</h1></div><button id="refresh" class="secondary">刷新</button></header>
        <p id="message" class="message" role="status" aria-live="polite" aria-atomic="true"></p>
        <div id="page"></div>
      </section>
    </section>
  </main>
  <template id="empty"><div class="empty">暂无数据</div></template>
  <script src="__ADMIN_PATH__/app.js"></script>
 <script src="__ADMIN_PATH__/account.js"></script>
 <script src="__ADMIN_PATH__/consolidation.js"></script>
 <script src="__ADMIN_PATH__/enhancements.js"></script>
</body>
</html>
