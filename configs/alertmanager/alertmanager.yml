global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Configure Slack, email, DingTalk, Teams or a webhook receiver in a private
  # override file for production. The checked-in default deliberately emits no
  # notifications to avoid leaking alerts during local development.
  - name: default
